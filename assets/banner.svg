<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.8" />
    </linearGradient>

    <!-- Mesh Wireframe Pattern -->
    <pattern id="wireframeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(129, 140, 248, 0.2)" />
    </pattern>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="deepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <style>
    /* CSS Keyframe Animations for Dynamic Aspects */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }

    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(40px, -25px); }
    }

    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-35px, 30px); }
    }

    @keyframes rotateWireframe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(420px); opacity: 0; }
    }

    @keyframes wavePath {
      0%, 100% { d: path("M 0 350 Q 300 320 600 350 T 1200 350 L 1200 420 L 0 420 Z"); }
      50% { d: path("M 0 350 Q 300 380 600 330 T 1200 350 L 1200 420 L 0 420 Z"); }
    }

    .anim-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .anim-orb1 { animation: floatOrb1 8s ease-in-out infinite; }
    .anim-orb2 { animation: floatOrb2 10s ease-in-out infinite; }
    .anim-rotate { animation: rotateWireframe 25s linear infinite; transform-origin: 1040px 210px; }
    .anim-scan { animation: scanline 7s ease-in-out infinite; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmospheric Backdrops (Stay deep in background) -->
  <g class="anim-orb1">
    <circle cx="220" cy="110" r="160" fill="#38bdf8" opacity="0.12" filter="url(#deepBlur)" />
  </g>
  <g class="anim-orb2">
    <circle cx="1000" cy="280" r="190" fill="#a855f7" opacity="0.15" filter="url(#deepBlur)" />
  </g>
  <g class="anim-pulse">
    <circle cx="600" cy="200" r="210" fill="#6366f1" opacity="0.1" filter="url(#deepBlur)" />
  </g>

  <!-- Geometric Grid Pattern Overlay -->
  <rect width="100%" height="100%" fill="url(#wireframeGrid)" />

  <!-- Dynamic Animated Scanline in Background -->
  <line class="anim-scan" x1="0" y1="0" x2="1200" y2="0" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.4" />

  <!-- Right Decorative Section: 3D Wireframe Icosahedron & Ring Mesh Simulation -->
  <g class="anim-rotate" opacity="0.45">
    <!-- Polyhedron Wireframe Rings -->
    <circle cx="1040" cy="210" r="110" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" />
    <circle cx="1040" cy="210" r="75" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 3" />
    <polygon points="1040,110 1120,165 1120,255 1040,310 960,255 960,165" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <polygon points="1040,135 1100,210 1040,285 980,210" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <line x1="1040" y1="110" x2="1040" y2="310" stroke="#818cf8" stroke-width="1" />
    <line x1="960" y1="165" x2="1120" y2="255" stroke="#818cf8" stroke-width="1" />
    <line x1="960" y1="255" x2="1120" y2="165" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Subtle Ambient Mesh Nodes & Connecting Edges -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.25">
    <line x1="80" y1="90" x2="160" y2="50" />
    <line x1="160" y1="50" x2="250" y2="110" />
    <line x1="250" y1="110" x2="180" y2="170" />
    <line x1="180" y1="170" x2="80" y2="90" />
    <circle cx="80" cy="90" r="3" fill="#38bdf8" />
    <circle cx="160" cy="50" r="2.5" fill="#818cf8" />
    <circle cx="250" cy="110" r="3" fill="#c084fc" />
    <circle cx="180" cy="170" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Foreground Content: Pill Badges, Titles, Subtitles (Never Covered, High Contrast) -->
  <g id="foregroundContent">
    <!-- Category Tag / Top Pill -->
    <g transform="translate(80, 52)">
      <rect width="320" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#38bdf8" filter="url(#glow)" />
      <text x="32" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">
        CURATED 3D TECH STACK &amp; REPOSITORIES
      </text>
    </g>

    <!-- Main Title: Awesome 3D Avatar Creation -->
    <text x="80" y="145" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome 3D Avatar Creation
    </text>

    <!-- Subtitle Line 1: WebGL Mesh Editing &amp; Conversational AI Humans -->
    <text x="80" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.2">
      WebGL &amp; WebGPU Mesh Deformation • VRM/glTF Digital Humans
    </text>

    <!-- Tagline / Value Proposition -->
    <text x="80" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS platforms, browser-based morph studios, blendshape rigging &amp; parametric 3D pipelines.
    </text>

    <!-- Interactive / Feature Highlights Interactive Badges in Foreground -->
    <g transform="translate(80, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#0ea5e9" stroke-width="1.2" />
        <text x="85" y="23" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎮 WebGL / Three.js</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(182, 0)">
        <rect width="180" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="90" y="23" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">👤 VRM &amp; SMPL-X Rig</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(374, 0)">
        <rect width="190" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#ec4899" stroke-width="1.2" />
        <text x="95" y="23" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✨ 3D Gaussian Avatars</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(576, 0)">
        <rect width="175" height="36" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#10b981" stroke-width="1.2" />
        <text x="87" y="23" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🤖 Conversational AI</text>
      </g>
    </g>

    <!-- Lower Meta Details Bar -->
    <g transform="translate(80, 360)">
      <line x1="0" y1="0" x2="750" y2="0" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        ⚡ MIT &amp; Open Licensed Tools • Enterprise SaaS Benchmarks • Pricing &amp; Free Tier Transparency
      </text>
    </g>
  </g>
</svg>